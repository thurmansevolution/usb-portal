[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-portal"
version = "1.3.0"
description = "usb|portal - share USB devices over LAN using USB/IP"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
usb-portal = "usb_portal.main:main"
usb-portal-daemon = "usb_portal.daemon:main"

[tool.setuptools.packages.find]
include = ["usb_portal*"]

[tool.setuptools.package-data]
usb_portal = ["native/*.c"]
